# Déploiement Netlify — le preset Nitro « netlify » génère :
#   - dist/                          → fichiers statiques (publish)
#   - .netlify/functions-internal/   → fonction serveur (SSR), détectée automatiquement
# Les builds Lovable ignorent ce fichier et restent sur Cloudflare.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
